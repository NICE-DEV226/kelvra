name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the floor declared in pyproject; 3.13 is the current stable.
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q
      - name: Lint
        run: python -m ruff check src tests examples

  demo:
    # The demo is documentation that can rot. Run it so it cannot.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -e .
      - name: Smoke-test the installed command
        # Installs differ from `python -m`: this is what catches a broken
        # console script or an exit code that only misbehaves once packaged.
        run: |
          kelvra --version
          kelvra --help > /dev/null
      - run: python examples/support_agent/demo.py
      - name: Check every policy in the repo
        # Dogfooding. A policy checker that does not run against this
        # project's own policies is not a checker anyone should trust.
        run: kelvra check $(git ls-files '*.klv')

  no-internal-docs:
    # docs/ holds internal working notes that must never be published.
    # A gitignore entry is a convention; this is the check.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Fail if internal docs were committed
        run: |
          if git ls-files --error-unmatch docs/ >/dev/null 2>&1; then
            echo "::error::docs/ is tracked. It holds internal notes and must stay private."
            git ls-files docs/
            exit 1
          fi
          echo "OK - no internal docs tracked."
