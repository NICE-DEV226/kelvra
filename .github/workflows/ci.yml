name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Kelvra is meant to be universal, not "developed on Windows and tested on
    # Linux". Line endings, encodings and paths are where the two disagree, so
    # every supported system runs the same suite.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # 3.10 is the floor declared in pyproject, 3.13 the current stable,
        # and 3.14 is what the project is actually developed on -- an
        # untested version that someone works in every day is the one most
        # likely to break without anyone noticing.
        python-version: ["3.10", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the locked dependencies
        # What is tested is what was audited. uv.lock is what the dependency audit
        # scans, and until now CI installed whatever pip resolved from the ranges in
        # pyproject.toml, which could be neither. [lsp] and [sign] are included so the
        # language server's protocol test and the Ed25519 tests run rather than skip
        # quietly, which is how wiring bugs survive. uv is pinned like everything else.
        run: >
          python -m pip install "uv==0.12.5" &&
          uv sync --frozen --extra dev --extra lsp --extra sign --extra seal --python ${{ matrix.python-version }}
      - name: What was installed
        run: uv pip list
      - name: Test
        # On Linux the differential test must really run against Go and Node (whose
        # decoders disagree with Python's), not skip because they were not found.
        env:
          KELVRA_REQUIRE_PEERS: ${{ matrix.os == 'ubuntu-latest' && 'go,node,jq' || '' }}
        run: uv run --frozen --no-sync python -m pytest -q
      - name: Lint
        run: uv run --frozen --no-sync python -m ruff check src tests examples evaluation

  test-unlocked:
    # The locked job above proves the code works with the versions that were audited. This
    # one installs whatever the ranges in pyproject.toml resolve to today, so that a
    # dependency release that breaks the project is seen before a user sees it. It does not
    # block: a red run here is a prompt to update the lock, not a failure of this change.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip && pip install -e ".[dev,lsp,sign,seal]"
      - run: python -m pytest -q

  interop:
    # The gateway against the official MCP SDK, client and server unmodified, on
    # both generations of the protocol. A fake server written from one's own
    # reading of the protocol cannot find what this finds: it has already caught
    # refusals the 2026-07-28 revision rejects, and a client left hanging when the
    # server died. Pinned, so a red run means the gateway broke, not that an SDK
    # moved; the job after this one tracks the latest release without blocking.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sdk: ["mcp==1.30.0", "mcp==2.3.0"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip && pip install -e ".[dev]" "${{ matrix.sdk }}"
      - run: python -m pytest tests/test_interop_mcp_sdk.py -q

  interop-latest:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip && pip install -e ".[dev]" mcp
      - run: python -m pytest tests/test_interop_mcp_sdk.py -q

  demo:
    # The demo is documentation that can rot. Run it so it cannot.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: pip install -e .
      - name: Smoke-test the installed command
        # Installs differ from `python -m`: this is what catches a broken
        # console script or an exit code that only misbehaves once packaged.
        run: |
          kelvra --version
          kelvra --help > /dev/null
      - run: python examples/support_agent/demo.py
      - name: Adversarial evaluation
        # Fails on a leak or a false positive. The point of running it here is
        # that a regression in the label model shows up as an attack getting
        # through, not as a unit test turning red in the abstract.
        run: python evaluation/run.py
      - name: Check every policy in the repo
        # Dogfooding. A policy checker that does not run against this
        # project's own policies is not a checker anyone should trust.
        run: kelvra check $(git ls-files '*.klv')

  nothing-foreign-tracked:
    # Some things in the working directory must never be published: internal
    # notes, and a separate project of the author's that lives alongside this
    # one. A .gitignore entry is a convention; this is the check.
    #
    # It exists because a blanket `git add -A` has twice taken something it
    # should not have. Each entry here was added after the fact, which is the
    # wrong order -- but a named guard beats remembering.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fail if anything foreign was committed
        run: |
          status=0
          for path in docs project-argus; do
            if git ls-files --error-unmatch "$path" >/dev/null 2>&1; then
              echo "::error::$path is tracked and must not be published."
              git ls-files "$path" | head -20
              status=1
            fi
          done
          # A gitlink (mode 160000) is an embedded repository committed by
          # accident. There are no intentional submodules in this project.
          if git ls-files -s | grep -q '^160000'; then
            echo "::error::an embedded git repository is tracked:"
            git ls-files -s | grep '^160000'
            status=1
          fi
          [ "$status" -eq 0 ] && echo "OK - nothing foreign tracked."
          exit "$status"
