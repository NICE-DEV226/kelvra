name: Dependency audit

# A vulnerability is disclosed on a day nobody touched the code, so this runs on
# a schedule as well as when the lockfile changes. It is a separate workflow on
# purpose: a new advisory against a dependency must not turn an unrelated pull
# request red, but it must not go unseen either.
#
# `uv audit` is marked experimental by uv and its output format may change; if it
# does, this job fails loudly rather than reporting a clean result it did not check.

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
  pull_request:
    paths: [uv.lock, pyproject.toml]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: python -m pip install "uv==0.12.5"
      - name: Audit the locked dependencies
        # --locked: fail if uv.lock does not match pyproject.toml, instead of
        # auditing a lock nobody installs. Sends package names and versions to the
        # advisory database (OSV); no code and no secrets leave the runner.
        run: uv audit --locked --preview-features audit-command
