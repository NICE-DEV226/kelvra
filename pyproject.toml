[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kelvra"
version = "0.1.0"
description = "Declare what an AI agent may know, prove what it did. Information flow control for LLM agent pipelines."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT OR Apache-2.0" }
authors = [{ name = "Azaël Wend-panga SAWADOGO" }]
keywords = [
    "information-flow-control",
    "ai-agents",
    "prompt-injection",
    "privacy",
    "audit",
    "mcp",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "Programming Language :: Python :: 3",
]

# The core has no third-party dependencies, on purpose. The MCP Python SDK
# ships its stable v2 on 2026-07-28 alongside a new specification release;
# binding the core to a dependency that turns over on that date would buy an
# immediate rewrite. MCP stays behind an optional adapter.
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=2.0.0"]
otel = ["opentelemetry-api>=1.42.0", "opentelemetry-sdk>=1.42.0"]
# Pinned exactly. An unpinned linter breaks CI on a day nobody changed
# anything, because its default rule set moved underneath the build. Bump it
# deliberately, in its own commit, with the findings it produces.
dev = ["pytest>=8.0,<9", "ruff==0.16.0"]

[project.urls]
Homepage = "https://github.com/NICE-DEV226/kelvra"
Issues = "https://github.com/NICE-DEV226/kelvra/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/kelvra"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py310"

[tool.ruff.lint]
# Chosen explicitly rather than inherited from whichever ruff happens to
# install. Ruff's defaults expand between releases; a rule set that is not
# written down is a rule set that changes without a commit.
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # import ordering
    "UP",  # pyupgrade
    "B",   # bugbear
    "RUF", # ruff-specific
]
