[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kelvra"
version = "0.1.0"
description = "Declare what an AI agent may know, prove what it did. Information flow control for LLM agent pipelines."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT OR Apache-2.0" }
authors = [{ name = "Azaël Wend-panga SAWADOGO" }]
keywords = [
    "information-flow-control",
    "ai-agents",
    "prompt-injection",
    "privacy",
    "audit",
    "mcp",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "Typing :: Typed",
    "Programming Language :: Python :: 3",
]

# The core has no third-party dependencies, on purpose. The MCP gateway speaks
# the protocol's JSON-RPC itself rather than binding to an SDK that turns over
# with each specification release.
dependencies = []

[project.optional-dependencies]
# The language server is the one place a third-party library earns its keep:
# an LSP is protocol plumbing around an analysis, and reimplementing the
# protocol would be work spent away from the part with value. The pure
# functions in kelvra.lsp run without it; only `kelvra lsp` needs it.
lsp = ["pygls>=2.1,<3"]
# Ed25519 signatures. The standard library has none, and writing a signature
# scheme by hand is the one thing to avoid; imported only when used.
sign = ["cryptography>=43"]
# Sealing (kelvra.sealing): AES-256-GCM and HKDF-SHA256 from the same library. A separate
# name so that asking for it says why; it is the same dependency, not a second one.
seal = ["cryptography>=43"]
# There used to be `mcp` and `otel` extras here with no code behind them. They
# pulled 40 packages into the lockfile -- and 46 of the 47 advisories a
# dependency audit found -- for nothing that ran. An extra comes back with the
# code that uses it.
# Pinned exactly. An unpinned linter breaks CI on a day nobody changed
# anything, because its default rule set moved underneath the build. Bump it
# deliberately, in its own commit, with the findings it produces.
# pytest 9.0.3 is the first release without GHSA-6w46-j5rx-g56g (tmpdir handling).
# hypothesis generates the inputs the properties in tests/test_properties.py are checked
# against, and shrinks a failure to the smallest one that still fails.
# mypy is pinned exactly for the same reason as ruff, and is here because the package ships py.typed:
# saying it is typed is only honest while something checks.
dev = ["pytest>=9.0.3,<10", "ruff==0.16.0", "mypy==2.4.0", "jsonschema>=4.20", "hypothesis>=6.100"]

[project.scripts]
kelvra = "kelvra.cli:main"

[project.urls]
Homepage = "https://github.com/NICE-DEV226/kelvra"
Issues = "https://github.com/NICE-DEV226/kelvra/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/kelvra"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Many tests produce a record on purpose without a key; the warning is covered by
# its own test (pytest.warns), and would otherwise bury every other warning.
filterwarnings = ["ignore:no signing key:kelvra.provenance.UnsignedRecordWarning"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.10"
files = ["src/kelvra"]
# Without this a function with no annotations is not checked at all, which is most of an untyped
# codebase and the part that matters.
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py310"

[tool.ruff.lint]
# Chosen explicitly rather than inherited from whichever ruff happens to
# install. Ruff's defaults expand between releases; a rule set that is not
# written down is a rule set that changes without a commit.
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # import ordering
    "UP",  # pyupgrade
    "B",   # bugbear
    "RUF", # ruff-specific
]
